server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    client_max_body_size 3m;
    index index.html;

    # Docker DNS is resolved per request, including after an API container restarts.
    resolver 127.0.0.11 valid=10s ipv6=off;
    proxy_connect_timeout 3s;
    proxy_read_timeout 120s;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

    location ~ ^/api/users(?:/|$) {
        set $api http://userservice:8080;
        proxy_pass $api$request_uri;
    }

    location ~ ^/api/(?:jobs|applications|integrations)(?:/|$) {
        set $api http://jobapplicationservice:8080;
        proxy_pass $api$request_uri;
    }

    location ~ ^/api/reminders(?:/|$) {
        set $api http://reminderservice:8080;
        proxy_pass $api$request_uri;
    }

    location /api/ {
        return 404;
    }

    location ~ ^/api/resumes(?:/|$) {
        set $api http://resumeservice:8080;
        proxy_pass $api$request_uri;
    }

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}

