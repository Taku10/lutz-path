<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#254d3f">
  <meta name="description" content="A little clarity for your next chapter. Save jobs, track applications, and keep your next steps in view with LutzPath.">
  <title>LutzPath — Your next chapter</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="stylesheet" href="/styles.css">
  <script type="module" src="/app.js"></script>
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>
  <div id="sidebar-scrim" class="sidebar-scrim" hidden></div>
  <aside class="sidebar" id="sidebar" aria-label="Workspace navigation">
    <a href="#jobs" class="brand" aria-label="LutzPath home">
      <span class="brand-mark"><svg viewBox="0 0 32 32" fill="none" aria-hidden="true"><path d="M10 8v12a4 4 0 0 0 4 4h10M10 16h6a6 6 0 0 0 6-6V8" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/><circle cx="10" cy="8" r="2" fill="currentColor"/><circle cx="24" cy="24" r="2" fill="currentColor"/></svg></span>
      <span>LutzPath<span class="brand-caption">A little direction. A big future.</span></span>
    </a>
    <span class="nav-label">WORKSPACE</span>
    <nav class="nav" id="navigation"></nav>
    <div class="sidebar-bottom">
      <div class="encouragement">
        <span class="encouragement-icon" id="encouragement-icon"></span>
        <strong>One step closer.</strong>
        <p>The right opportunity starts with your next small step.</p>
        <span class="tiny-path"><span></span><span></span><span></span><span></span></span>
      </div>
      <button class="profile-settings" data-action="edit-profile"><span id="sidebar-avatar" class="avatar">LP</span><span><strong id="sidebar-name">Your profile</strong><small>Manage profile</small></span><span id="profile-edit-icon"></span></button>
      <div class="sidebar-footer"><span class="live-dot"></span> Your next chapter, organized.</div>
    </div>
  </aside>
  <div class="workspace">
    <header class="topbar">
      <div class="breadcrumb"><button class="icon-button mobile-menu" id="mobile-menu" aria-label="Open navigation" aria-expanded="false" aria-controls="sidebar"></button><span class="breadcrumb-root">Your workspace</span><span class="breadcrumb-separator">/</span><span id="breadcrumb-current">Overview</span></div>
      <div class="topbar-actions"><span id="today-label" class="today-label"></span><button class="icon-button" data-action="refresh" aria-label="Refresh workspace" title="Refresh workspace" id="refresh-button"></button><button class="icon-button notifications" data-view="reminders" aria-label="View reminders" id="reminders-button"></button><span class="topbar-divider"></span><label class="profile-switcher"><span class="sr-only">Active profile</span><select id="profile-select" aria-label="Active profile"><option value="">Choose a profile</option></select></label><button class="icon-button" data-action="new-profile" aria-label="Add profile" title="Add profile" id="add-profile-button"></button></div>
    </header>
    <div id="connection-banner" class="connection-banner" role="alert" hidden></div>
    <main id="main" tabindex="-1" aria-busy="true"><div class="loading-screen"><span class="spinner"></span><span>Getting your workspace ready…</span></div></main>
    <footer class="workspace-footer"><span>LutzPath</span><span>Built for the beginning of something good.</span></footer>
  </div>
  <dialog id="editor" class="editor" aria-labelledby="editor-title"></dialog>
  <dialog id="confirmation" class="confirmation" aria-labelledby="confirm-title"></dialog>
  <div id="toast-region" class="toast-region" aria-live="polite" aria-atomic="false"></div>
  <noscript><div class="noscript">Please enable JavaScript to use your LutzPath workspace.</div></noscript>
</body>
</html>
